<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="用途と環境から、先に揃えるクリエイター機材カテゴリを整理する無料診断。"><title>Creator Gear Router</title><link rel="stylesheet" href="style.css"></head><body><main><header><p class="eyebrow">FREE / LOCAL-FIRST</p><h1>Creator Gear Router</h1><p>機材名から探す前に、用途から「何が必要か」を整理する。</p></header><section class="panel"><label>やること<select id="work"><option value="meeting">会議・収録</option><option value="stream">配信・動画</option><option value="product">商品撮影</option><option value="mobile">外作業・持ち運び</option></select></label><label>いちばん困っていること<select id="pain"><option value="audio">音</option><option value="light">暗さ・見え方</option><option value="stable">固定・ブレ</option><option value="storage">容量・バックアップ</option></select></label><label>予算感<select id="budget"><option value="low">まず最小構成</option><option value="mid">1〜2万円程度から</option><option value="flex">必要性優先</option></select></label><button id="run">必要カテゴリを整理する</button></section><section id="result" class="result" hidden><h2>先に見る順番</h2><div id="route"></div><div id="offers"></div><p class="disclosure">広告リンクがある場合は「広告」と表示します。診断結果は広告なしでも使えます。</p></section><footer>用途 → ボトルネック → 最小構成の順で考える無料ツール。</footer></main><script src="affiliate-config.js"></script><script src="app.js"></script></body></html>
